<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nova, a focused calculator built with HTML, CSS and JavaScript." />
    <title>Nova Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-label="Nova Calculator">
          <span class="brand-dot"></span>
          <span>NOVA</span>
        </div>
        <p class="header-note">A small, focused calculator</p>
      </header>

      <section class="workspace" aria-label="Calculator workspace">
        <article class="calculator-card">
          <div class="display-panel">
            <div class="display-topline">
              <span id="status-label">Ready</span>
              <button class="icon-button" id="copy-button" type="button" aria-label="Copy result" title="Copy result">Copy</button>
            </div>
            <div class="expression" id="expression" aria-live="polite">0</div>
            <div class="result" id="result" aria-live="polite">0</div>
          </div>

          <div class="keypad" aria-label="Calculator keys">
            <button class="key key-muted" type="button" data-action="clear">AC</button>
            <button class="key key-muted" type="button" data-action="sign">+/−</button>
            <button class="key key-muted" type="button" data-action="percent">%</button>
            <button class="key key-operator" type="button" data-operation="divide" aria-label="Divide">÷</button>

            <button class="key" type="button" data-number="7">7</button>
            <button class="key" type="button" data-number="8">8</button>
            <button class="key" type="button" data-number="9">9</button>
            <button class="key key-operator" type="button" data-operation="multiply" aria-label="Multiply">×</button>

            <button class="key" type="button" data-number="4">4</button>
            <button class="key" type="button" data-number="5">5</button>
            <button class="key" type="button" data-number="6">6</button>
            <button class="key key-operator" type="button" data-operation="subtract" aria-label="Subtract">−</button>

            <button class="key" type="button" data-number="1">1</button>
            <button class="key" type="button" data-number="2">2</button>
            <button class="key" type="button" data-number="3">3</button>
            <button class="key key-operator" type="button" data-operation="add" aria-label="Add">+</button>

            <button class="key key-zero" type="button" data-number="0">0</button>
            <button class="key" type="button" data-action="decimal">.</button>
            <button class="key key-equals" type="button" data-action="equals" aria-label="Equals">=</button>
          </div>
        </article>

        <aside class="history-card" aria-labelledby="history-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Session</p>
              <h2 id="history-title">Recent calculations</h2>
            </div>
            <button class="text-button" id="clear-history" type="button">Clear</button>
          </div>
          <div class="history-list" id="history-list">
            <p class="empty-state">Your calculations will appear here.</p>
          </div>
          <p class="keyboard-hint">Tip: use your keyboard for faster input.</p>
        </aside>
      </section>

      <footer class="app-footer">
        <span>Built with HTML, CSS and JavaScript.</span>
        <span class="footer-status"><span class="status-pip"></span>Ready to calculate</span>
      </footer>
    </main>
  </body>
</html>
